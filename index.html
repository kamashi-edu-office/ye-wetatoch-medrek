<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የወጣቶች የፈጠራ መድረክ</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--tg-theme-bg-color, #121212);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 15px;
        }
        .header { text-align: center; margin-bottom: 18px; }
        .tabs {
            display: flex;
            justify-content: space-between;
            background: #222;
            border-radius: 10px;
            padding: 5px;
            margin-bottom: 18px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px 5px;
            border: none;
            background: transparent;
            color: #aaa;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
        }
        .tab-btn.active { background: #0088cc; color: #fff; }
        .section { display: none; background: #1e1e1e; padding: 15px; border-radius: 12px; }
        .section.active { display: block; }
        input, textarea {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px 0;
            border-radius: 8px;
            border: 1px solid #333;
            background: #2c2c2c;
            color: #fff;
            box-sizing: border-box;
            font-size: 14px;
        }
        .action-btn {
            width: 100%;
            padding: 13px;
            background: #0088cc;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }
        .media-grid {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }
        .voice-btn {
            flex: 1;
            padding: 12px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        .video-btn {
            flex: 1;
            padding: 12px;
            background: #e67e22;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        .feed-btn {
            display: block;
            text-align: center;
            width: 100%;
            padding: 13px;
            background: #333;
            color: #4da6ff;
            border: 1px solid #4da6ff;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            box-sizing: border-box;
        }
        .status-box {
            padding: 12px;
            border-radius: 8px;
            margin-top: 12px;
            font-size: 13px;
            display: none;
        }
        #media-preview {
            margin-bottom: 12px;
            display: none;
            background: #2a2a2a;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            color: #a3f7a3;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>🚀 የወጣቶች የፈጠራ መድረክ</h2>
        <p id="user-greeting" style="font-size: 13px; color: #aaa;">እንኳን በደህና መጡ!</p>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="openTab('mystery', this)">🎙️ 1. ምስጢር</button>
        <button class="tab-btn" onclick="openTab('barter', this)">🤝 2. ክህሎት</button>
        <button class="tab-btn" onclick="openTab('capsule', this)">⏳ 3. ካፕሱል</button>
    </div>

    <!-- ክፍል 1: የድምፅ ምስጢር፣ ቪዲዮ እና ጽሁፍ -->
    <div id="mystery" class="section active">
        <h3>🎙️ የድምፅ ምስጢር እና ቪዲዮ</h3>
        <p style="font-size: 13px; color: #ccc;">ድምፅ ወይም ቪዲዮ ይቅረጹ፤ ወይም እንቆቅልሽዎን በጽሁፍ ይልቀቁ።</p>
        
        <div class="media-grid">
            <label class="voice-btn">
                🎙️ ድምፅ ቅዳ
                <input type="file" id="audio-input" accept="audio/*" capture="microphone" style="display:none;" onchange="handleFileSelect(this, 'audio')">
            </label>
            <label class="video-btn">
                🎥 ቪዲዮ ቅረጽ
                <input type="file" id="video-input" accept="video/*" capture="camcorder" style="display:none;" onchange="handleFileSelect(this, 'video')">
            </label>
        </div>

        <div id="media-preview"></div>
        
        <textarea id="mystery-text" rows="3" placeholder="እንቆቅልሽዎን ወይም አዲስ ሀሳብዎን እዚህ ይጻፉ (አማራጭ)..."></textarea>
        <button class="action-btn" onclick="postDirectly('mystery')">ለሁሉም ወጣቶች ልቀቅ 🚀</button>
        <div id="status-mystery" class="status-box"></div>
    </div>

    <!-- ክፍል 2: የክህሎት ልውውጥ -->
    <div id="barter" class="section">
        <h3>🤝 የክህሎት ልውውጥ (Skill Barter)</h3>
        <p style="font-size: 13px; color: #ccc;">ያለ ገንዘብ እውቀት ይለዋወጡ። ጥያቄዎ በቀጥታ ለሁሉም ይፖሰታል።</p>
        <label style="font-size:13px;">እኔ ማስተማር የምችለው ክህሎት፡</label>
        <input type="text" id="offer-skill" placeholder="ለምሳሌ፡ ፎቶ ኤዲቲንግ፣ እንግሊዝኛ...">
        <label style="font-size:13px;">መማር የምፈልገው ክህሎት፡</label>
        <input type="text" id="want-skill" placeholder="ለምሳሌ፡ ኮዲንግ፣ ግራፊክ ዲዛይን...">
        <button class="action-btn" onclick="postDirectly('barter')">የክህሎት ጥያቄውን ልቀቅ 🤝</button>
        <div id="status-barter" class="status-box"></div>
    </div>

    <!-- ክፍል 3: የትውልድ የጊዜ ካፕሱል -->
    <div id="capsule" class="section">
        <h3>⏳ የወደፊት የጊዜ ካፕሱል</h3>
        <p style="font-size: 13px; color: #ccc;">ለወደፊት እራስዎ መልዕክት አስቀምጠው ይቆልፉ።</p>
        <textarea id="capsule-msg" rows="3" placeholder="ለወደፊት እራስዎ የሚያስተላልፉት መልዕክት..."></textarea>
        <label style="font-size:13px;">መልዕክቱ የሚከፈትበት ቀን፡</label>
        <input type="date" id="capsule-date">
        <button class="action-btn" onclick="postDirectly('capsule')">ካፕሱሉን ቆልፍ 🔒</button>
        <div id="status-capsule" class="status-box"></div>
    </div>

    <button class="feed-btn" onclick="openChannel()">📺 የተጋሩትን ድምፆችን እና ቪዲዮዎችን ይመልከቱ</button>

    <script>
        const BOT_TOKEN = "9121286572:AAGSHH0A4yIQiCqJNjgXGFaGrwZFhGJesGw"; 
        const CHANNEL_USERNAME = "wetatoch_medrek_feed"; 

        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let selectedFile = null;
        let selectedMediaType = null;

        let userName = "ወጣት";
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            userName = tg.initDataUnsafe.user.first_name;
            if (tg.initDataUnsafe.user.username) {
                userName += ` (@${tg.initDataUnsafe.user.username})`;
            }
            document.getElementById('user-greeting').innerText = `እንኳን በደህና መጡ፣ ${tg.initDataUnsafe.user.first_name}!`;
        }

        function openTab(tabId, btnElement) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btnElement.classList.add('active');
        }

        function openChannel() {
            tg.openTelegramLink(`https://t.me{CHANNEL_USERNAME}`);
        }

        function handleFileSelect(input, type) {
            if (input.files && input.files[0]) {
                selectedFile = input.files[0];
                selectedMediaType = type;
                const preview = document.getElementById('media-preview');
                preview.style.display = "block";
                const label = type === 'audio' ? '🎙️ ድምፅ ተዘጋጅቷል' : '🎥 ቪዲዮ ተዘጋጅቷል';
                preview.innerHTML = `${label}: <b>${selectedFile.name}</b> <span style="color:#ff7777; cursor:pointer; float:right;" onclick="clearMedia()">[ሰርዝ ✖]</span>`;
            }
        }

        function clearMedia() {
            selectedFile = null;
            selectedMediaType = null;
            document.getElementById('audio-input').value = '';
            document.getElementById('video-input').value = '';
            document.getElementById('media-preview').style.display = 'none';
        }

        async function postDirectly(type) {
            let statusBox = document.getElementById(`status-${type}`);
            statusBox.style.display = "block";
            statusBox.style.background = "#333";
            statusBox.style.color = "#fff";
            statusBox.innerText = "⏳ እየተላከ ነው... እባክዎ ይጠብቁ";

            try {
                // 1. ድምፅ ወይም ቪዲዮ ከተመረጠ
                if (type === 'mystery' && selectedFile) {
                    const captionText = document.getElementById('mystery-text').value.trim();
                    const fullCaption = captionText 
                        ? `🎙️ <b>አዲስ የድምፅ/ቪዲዮ ምስጢር</b>\n\n${captionText}` 
                        : `🎙️ <b>አዲስ የድምፅ/ቪዲዮ ምስጢር</b>`;

                    const formData = new FormData();
                    formData.append("chat_id", `@${CHANNEL_USERNAME}`);
                    formData.append("caption", fullCaption);
                    formData.append("parse_mode", "HTML");

                    let endpoint = "";
                    if (selectedMediaType === 'audio') {
                        formData.append("audio", selectedFile);
                        endpoint = "sendAudio";
                    } else {
                        formData.append("video", selectedFile);
                        endpoint = "sendVideo";
                    }

                    await fetch(`https://telegram.org{BOT_TOKEN}/${endpoint}`, {
