<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የወጣቶች የፈጠራ መድረክ</title>
    <!-- ትክክለኛው የቴሌግራም Mini App ስክሪፕት -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--tg-theme-bg-color, #121212);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 15px;
        }
        .header { text-align: center; margin-bottom: 18px; }
        .tabs {
            display: flex;
            justify-content: space-between;
            background: #222;
            border-radius: 10px;
            padding: 5px;
            margin-bottom: 18px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px 5px;
            border: none;
            background: transparent;
            color: #aaa;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
        }
        .tab-btn.active { background: #0088cc; color: #fff; }
        .section { display: none; background: #1e1e1e; padding: 15px; border-radius: 12px; }
        .section.active { display: block; }
        input, textarea {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px 0;
            border-radius: 8px;
            border: 1px solid #333;
            background: #2c2c2c;
            color: #fff;
            box-sizing: border-box;
            font-size: 14px;
        }
        .action-btn {
            width: 100%;
            padding: 13px;
            background: #0088cc;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }
        .voice-btn {
            width: 100%;
            padding: 13px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 12px;
        }
        .feed-btn {
            display: block;
            text-align: center;
            width: 100%;
            padding: 13px;
            background: #333;
            color: #4da6ff;
            border: 1px solid #4da6ff;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            text-decoration: none;
            margin-top: 20px;
            box-sizing: border-box;
        }
        .status-box {
            padding: 12px;
            border-radius: 8px;
            margin-top: 12px;
            font-size: 13px;
            display: none;
            background: #264d26;
            color: #a3f7a3;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>🚀 የወጣቶች የፈጠራ መድረክ</h2>
        <p id="user-greeting" style="font-size: 13px; color: #aaa;">እንኳን በደህና መጡ!</p>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="openTab('mystery', this)">🎙️ 1. ምስጢር</button>
        <button class="tab-btn" onclick="openTab('barter', this)">🤝 2. ክህሎት</button>
        <button class="tab-btn" onclick="openTab('capsule', this)">⏳ 3. ካፕሱል</button>
    </div>

    <!-- ክፍል 1: የድምፅ ምስጢር እና ቪዲዮ -->
    <div id="mystery" class="section active">
        <h3>🎙️ የድምፅ ምስጢር እና ቪዲዮ</h3>
        <p style="font-size: 13px; color: #ccc;">ድምፅ ወይም ቪዲዮ ለመቅዳት አረንጓዴውን ቁልፍ ይጫኑ፤ ወይም እንቆቅልሽዎን በጽሁፍ ይልቀቁ።</p>
        
        <button class="voice-btn" onclick="openBotForMedia()">🎙️ ድምፅ ወይም 🎥 ቪዲዮ ቅዳ (በቦቱ)</button>
        
        <textarea id="mystery-text" rows="3" placeholder="እንቆቅልሽዎን ወይም አዲስ ሀሳብዎን እዚህ ይጻፉ..."></textarea>
        <button class="action-btn" onclick="postDirectly('mystery')">ለሁሉም ወጣቶች ልቀቅ 🚀</button>
        <div id="status-mystery" class="status-box"></div>
    </div>

    <!-- ክፍል 2: የክህሎት ልውውጥ -->
    <div id="barter" class="section">
        <h3>🤝 የክህሎት ልውውጥ (Skill Barter)</h3>
        <p style="font-size: 13px; color: #ccc;">ያለ ገንዘብ እውቀት ይለዋወጡ። ጥያቄዎ በቀጥታ ለሁሉም ይፖሰታል።</p>
        <label style="font-size:13px;">እኔ ማስተማር የምችለው ክህሎት፡</label>
        <input type="text" id="offer-skill" placeholder="ለምሳሌ፡ ፎቶ ኤዲቲንግ፣ እንግሊዝኛ...">
        <label style="font-size:13px;">መማር የምፈልገው ክህሎት፡</label>
        <input type="text" id="want-skill" placeholder="ለምሳሌ፡ ኮዲንግ፣ ግራፊክ ዲዛይን...">
        <button class="action-btn" onclick="postDirectly('barter')">የክህሎት ጥያቄውን ልቀቅ 🤝</button>
        <div id="status-barter" class="status-box"></div>
    </div>

    <!-- ክፍል 3: የትውልድ የጊዜ ካፕሱል -->
    <div id="capsule" class="section">
        <h3>⏳ የወደፊት የጊዜ ካፕሱል</h3>
        <p style="font-size: 13px; color: #ccc;">ለወደፊት እራስዎ መልዕክት አስቀምጠው ይቆልፉ።</p>
        <textarea id="capsule-msg" rows="3" placeholder="ለወደፊት እራስዎ የሚያስተላልፉት መልዕክት..."></textarea>
        <label style="font-size:13px;">መልዕክቱ የሚከፈትበት ቀን፡</label>
        <input type="date" id="capsule-date">
        <button class="action-btn" onclick="postDirectly('capsule')">ካፕሱሉን ቆልፍ 🔒</button>
        <div id="status-capsule" class="status-box"></div>
    </div>

    <!-- የቻናል ሊንክዎን እዚህ href ውስጥ ያስገቡ -->
    <a href="https://t.me" class="feed-btn" target="_blank">📺 የተጋሩትን ድምፆችን እና ቪዲዮዎችን ይመልከቱ</a>

    <script>
        // የቴሌግራም WebApp ን ማስጀመር
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // ገጹን በሙሉ ስክሪን እንዲከፍት ያደርገዋል

        // የተጠቃሚውን ስም ከቴሌግራም አንብቦ ሰላምታ ማሳየት
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const firstName = tg.initDataUnsafe.user.first_name;
            document.getElementById('user-greeting').innerText = `እንኳን በደህና መጡ፣ ${firstName}!`;
        }

        // ትሮችን (Tabs) መቀያየሪያ
        function openTab(tabId, btnElement) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            btnElement.classList.add('active');
        }

        // ድምፅ ወይም ቪዲዮ ለመቅዳት ወደ ቦቱ መመለስ
        function openBotForMedia() {
            tg.sendData(JSON.stringify({ action: "record_media" }));
            tg.close();
        }

        // መረጃውን ወደ ቦቱ መላኪያ
        function postDirectly(type) {
            let payload = { type: type };

            if (type === 'mystery') {
                const text = document.getElementById('mystery-text').value.trim();
                if (!text) return tg.showAlert("እባክዎ መጀመሪያ ጽሁፍ ያስገቡ!");
                payload.text = text;
            } else if (type === 'barter') {
                const offer = document.getElementById('offer-skill').value.trim();
                const want = document.getElementById('want-skill').value.trim();
                if (!offer || !want) return tg.showAlert("እባክዎ ሁለቱንም ክህሎቶች ይሙሉ!");
                payload.offer = offer;
                payload.want = want;
            } else if (type === 'capsule') {
                const msg = document.getElementById('capsule-msg').value.trim();
                const date = document.getElementById('capsule-date').value;
                if (!msg || !date) return tg.showAlert("እባክዎ መልዕክቱን እና ቀኑን ይምረጡ!");
                payload.msg = msg;
                payload.date = date;
            }

            // መረጃውን ለቴሌግራም ቦት መላክ (ቦቱ web_app_data በሚለው ይቀበለዋል)
            tg.sendData(JSON.stringify(payload));
        }
    </script>
</body>
</html>
