<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የወጣቶች የፈጠራ መድረክ</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--tg-theme-bg-color, #121212);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 15px;
        }
        .header { text-align: center; margin-bottom: 18px; }
        .tabs {
            display: flex;
            justify-content: space-between;
            background: #222;
            border-radius: 10px;
            padding: 5px;
            margin-bottom: 18px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px 5px;
            border: none;
            background: transparent;
            color: #aaa;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
        }
        .tab-btn.active { background: #0088cc; color: #fff; }
        .section { display: none; background: #1e1e1e; padding: 15px; border-radius: 12px; }
        .section.active { display: block; }
        input, textarea {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px 0;
            border-radius: 8px;
            border: 1px solid #333;
            background: #2c2c2c;
            color: #fff;
            box-sizing: border-box;
            font-size: 14px;
        }
        .action-btn {
            width: 100%;
            padding: 13px;
            background: #0088cc;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }
        .voice-btn {
            width: 100%;
            padding: 13px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 12px;
        }
        .feed-btn {
            display: block;
            text-align: center;
            width: 100%;
            padding: 13px;
            background: #333;
            color: #4da6ff;
            border: 1px solid #4da6ff;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            text-decoration: none;
            margin-top: 20px;
            box-sizing: border-box;
        }
        .status-box {
            padding: 12px;
            border-radius: 8px;
            margin-top: 12px;
            font-size: 13px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>🚀 የወጣቶች የፈጠራ መድረክ</h2>
        <p id="user-greeting" style="font-size: 13px; color: #aaa;">እንኳን በደህና መጡ!</p>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="openTab('mystery', this)">🎙️ 1. ምስጢር</button>
        <button class="tab-btn" onclick="openTab('barter', this)">🤝 2. ክህሎት</button>
        <button class="tab-btn" onclick="openTab('capsule', this)">⏳ 3. ካፕሱል</button>
    </div>

    <!-- ክፍል 1: የድምፅ ምስጢር እና ቪዲዮ -->
    <div id="mystery" class="section active">
        <h3>🎙️ የድምፅ ምስጢር እና ቪዲዮ</h3>
        <p style="font-size: 13px; color: #ccc;">ድምፅ ወይም ቪዲዮ ለመቅዳት አረንጓዴውን ቁልፍ ይጫኑ፤ ወይም እንቆቅልሽዎን በጽሁፍ ይልቀቁ።</p>
        
        <button class="voice-btn" onclick="openBotForMedia()">🎙️ ድምፅ ወይም 🎥 ቪዲዮ ቅዳ (በቦቱ)</button>
        
        <textarea id="mystery-text" rows="3" placeholder="እንቆቅልሽዎን ወይም አዲስ ሀሳብዎን እዚህ ይጻፉ..."></textarea>
        <button class="action-btn" onclick="postDirectly('mystery')">ለሁሉም ወጣቶች ልቀቅ 🚀</button>
        <div id="status-mystery" class="status-box"></div>
    </div>

    <!-- ክፍል 2: የክህሎት ልውውጥ -->
    <div id="barter" class="section">
        <h3>🤝 የክህሎት ልውውጥ (Skill Barter)</h3>
        <p style="font-size: 13px; color: #ccc;">ያለ ገንዘብ እውቀት ይለዋወጡ። ጥያቄዎ በቀጥታ ለሁሉም ይፖሰታል።</p>
        <label style="font-size:13px;">እኔ ማስተማር የምችለው ክህሎት፡</label>
        <input type="text" id="offer-skill" placeholder="ለምሳሌ፡ ፎቶ ኤዲቲንግ፣ እንግሊዝኛ...">
        <label style="font-size:13px;">መማር የምፈልገው ክህሎት፡</label>
        <input type="text" id="want-skill" placeholder="ለምሳሌ፡ ኮዲንግ፣ ግራፊክ ዲዛይን...">
        <button class="action-btn" onclick="postDirectly('barter')">የክህሎት ጥያቄውን ልቀቅ 🤝</button>
        <div id="status-barter" class="status-box"></div>
    </div>

    <!-- ክፍል 3: የትውልድ የጊዜ ካፕሱል -->
    <div id="capsule" class="section">
        <h3>⏳ የወደፊት የጊዜ ካፕሱል</h3>
        <p style="font-size: 13px; color: #ccc;">ለወደፊት እራስዎ መልዕክት አስቀምጠው ይቆልፉ።</p>
        <textarea id="capsule-msg" rows="3" placeholder="ለወደፊት እራስዎ የሚያስተላልፉት መልዕክት..."></textarea>
        <label style="font-size:13px;">መልዕክቱ የሚከፈትበት ቀን፡</label>
        <input type="date" id="capsule-date">
        <button class="action-btn" onclick="postDirectly('capsule')">ካፕሱሉን ቆልፍ 🔒</button>
        <div id="status-capsule" class="status-box"></div>
    </div>

    <a id="channel-link" href="https://t.me" class="feed-btn" target="_blank">📺 የተጋሩትን ድምፆችን እና ቪዲዮዎችን ይመልከቱ</a>

    <script>
        const BOT_TOKEN = "9121286572:AAGSHH0A4yIQiCqJNjgXGFaGrwZFhGJesGw"; 
        const BOT_USERNAME = "wetatoch_medrek_bot";
        const CHANNEL_USERNAME = "wetatoch_medrek_feed"; 

        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let userName = "ወጣት";
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            userName = tg.initDataUnsafe.user.first_name;
            if (tg.initDataUnsafe.user.username) {
                userName += ` (@${tg.initDataUnsafe.user.username})`;
            }
            document.getElementById('user-greeting').innerText = `እንኳን በደህና መጡ፣ ${tg.initDataUnsafe.user.first_name}!`;
        }

        function openTab(tabId, btnElement) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btnElement.classList.add('active');
        }

        function openBotForMedia() {
            tg.openTelegramLink(`https://t.me{BOT_USERNAME}?start=record`);
        }

        async function postDirectly(type) {
            let statusBox = document.getElementById(`status-${type}`);
            let message = "";

            if (type === 'mystery') {
                const text = document.getElementById('mystery-text').value.trim();
                if (!text) return alert("እባክዎ መጀመሪያ ጽሁፍ ያስገቡ!");
                message = `🎙️ <b>አዲስ ምስጢር / እንቆቅልሽ</b>\n\n${text}`;
            } else if (type === 'barter') {
                const offer = document.getElementById('offer-skill').value.trim();
                const want = document.getElementById('want-skill').value.trim();
                if (!offer || !want) return alert("እባክዎ ሁለቱንም ክህሎቶች ይሙሉ!");
                message = `🤝 <b>የክህሎት ልውውጥ</b>\n\n✅ <b>ማስተማር የምችለው፦</b> ${offer}\n📚 <b>መማር የምፈልገው፦</b> ${want}\n👤 <b>ላኪው፦</b> ${userName}`;
            } else if (type === 'capsule') {
                const msg = document.getElementById('capsule-msg').value.trim();
                const date = document.getElementById('capsule-date').value;
                if (!msg || !date) return alert("እባክዎ መልዕክቱን እና ቀኑን ይምረጡ!");
                message = `⏳ <b>የጊዜ ካፕሱል ተቆልፏል!</b>\n\n📅 <b>የሚከፈትበት ቀን፦</b> ${date}\n👤 <b>ባለቤት፦</b> ${userName}\n\n<i>(መልዕክቱ በተጠቀሰው ቀን ይፋ ይሆናል)</i>`;
            }

            statusBox.style.display = "block";
            statusBox.style.background = "#333";
            statusBox.style.color = "#fff";
            statusBox.innerText = "⏳ እየተላከ ነው...";

            try {
                const response = await fetch(`https://telegram.org{BOT_TOKEN}/sendMessage`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        chat_id: `@${CHANNEL_USERNAME}`,
                        text: message,
                        parse_mode: "HTML"
                    })
                });

                const result = await response.json();
                if (result.ok) {
                    statusBox.style.background = "#264d26";
                    statusBox.style.color = "#a3f7a3";
                    statusBox.innerText = "✅ በተሳካ ሁኔታ ወደ ቻናሉ ተልኳል!";
                    document.querySelectorAll('textarea, input[type="text"]').forEach(el => el.value = '');
                } else {
                    throw new Error(result.description);
                }
            } catch (error) {
                statusBox.style.background = "#5c1e1e";
                statusBox.style.color = "#ff9999";
                statusBox.innerText = "❌ ስህተት፦ " + error.message;
            }
        }
    </script>
</body>
</html>
