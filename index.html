<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የወጣቶች የፈጠራ መድረክ</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--tg-theme-bg-color, #121212);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 15px;
        }
        .header { text-align: center; margin-bottom: 20px; }
        .tabs {
            display: flex;
            justify-content: space-between;
            background: #222;
            border-radius: 10px;
            padding: 5px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px 5px;
            border: none;
            background: transparent;
            color: #aaa;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
        }
        .tab-btn.active { background: #0088cc; color: #fff; }
        .section { display: none; background: #1e1e1e; padding: 15px; border-radius: 12px; }
        .section.active { display: block; }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px 0;
            border-radius: 8px;
            border: 1px solid #333;
            background: #2c2c2c;
            color: #fff;
            box-sizing: border-box;
        }
        .action-btn {
            width: 100%;
            padding: 12px;
            background: #0088cc;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }
        .record-btn {
            width: 100%;
            padding: 12px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .record-btn.recording {
            background: #dc3545;
            animation: pulse 1.2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }
        audio {
            width: 100%;
            margin-top: 8px;
            height: 36px;
        }
        .card {
            background: #2a2a2a;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            border-left: 4px solid #0088cc;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>🚀 የወጣቶች የፈጠራ መድረክ</h2>
        <p id="user-greeting" style="font-size: 14px; color: #aaa;">እንኳን በደህና መጡ!</p>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="openTab('mystery', this)">🎙️ 1. ምስጢር</button>
        <button class="tab-btn" onclick="openTab('barter', this)">🤝 2. ክህሎት</button>
        <button class="tab-btn" onclick="openTab('capsule', this)">⏳ 3. ካፕሱል</button>
    </div>

    <!-- ክፍል 1: የድምፅ ምስጢር እና ጨዋታ -->
    <div id="mystery" class="section active">
        <h3>🎙️ የድምፅ ምስጢር እና እንቆቅልሽ</h3>
        <p style="font-size: 13px; color: #ccc;">በድምፅ ወይም በጽሁፍ አስቂኝ እንቆቅልሽ ይጠይቁ!</p>
        
        <button id="rec-btn-mystery" class="record-btn" onclick="toggleRecord('mystery')">🎙️ ድምፅ መቅዳት ጀምር</button>
        <div id="preview-mystery"></div>

        <textarea id="mystery-text" rows="2" placeholder="ተጨማሪ ጽሁፍ ካለዎት እዚህ ይጻፉ..."></textarea>
        <button class="action-btn" onclick="postMystery()">ልቀቅ (Post)</button>
        <div id="mystery-list"></div>
    </div>

    <!-- ክፍል 2: የክህሎት ልውውጥ -->
    <div id="barter" class="section">
        <h3>🤝 የክህሎት ልውውጥ (Skill Barter)</h3>
        <p style="font-size: 13px; color: #ccc;">ያለ ገንዘብ እውቀት ይለዋወጡ።</p>
        <label>እኔ ማስተማር የምችለው ክህሎት፡</label>
        <input type="text" id="offer-skill" placeholder="ለምሳሌ፡ ፎቶ ኤዲቲንግ፣ እንግሊዝኛ...">
        <label>መማር የምፈልገው ክህሎት፡</label>
        <input type="text" id="want-skill" placeholder="ለምሳሌ፡ ኮዲንግ፣ ግራፊክ ዲዛይን...">
        <button class="action-btn" onclick="postBarter()">አጋር ፈልግ</button>
        <div id="barter-list"></div>
    </div>

    <!-- ክፍል 3: የትውልድ የጊዜ ካፕሱል -->
    <div id="capsule" class="section">
        <h3>⏳ የወደፊት የጊዜ ካፕሱል</h3>
        <p style="font-size: 13px; color: #ccc;">ለወደፊት እራስዎ የድምፅ ወይም የጽሁፍ መልዕክት ይቆልፉ።</p>
        
        <button id="rec-btn-capsule" class="record-btn" onclick="toggleRecord('capsule')">🎙️ የድምፅ መልዕክት ቅዳ</button>
        <div id="preview-capsule"></div>

        <textarea id="capsule-msg" rows="2" placeholder="ለወደፊት እራስዎ የሚያስተላልፉት ጽሁፍ..."></textarea>
        <label>መልዕክቱ የሚከፈትበት ቀን፡</label>
        <input type="date" id="capsule-date">
        <button class="action-btn" onclick="saveCapsule()">ካፕሱሉን ቆልፍ 🔒</button>
        <div id="capsule-list"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('user-greeting').innerText = 
                "ሰላም " + tg.initDataUnsafe.user.first_name + "! የፈጠራ ጉዞህን ጀምር።";
        }

        function openTab(tabId, btn) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        // የድምፅ መቅጃ (Voice Recorder Logic)
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;
        let recordedUrls = { mystery: null, capsule: null };

        async function toggleRecord(section) {
            const btn = document.getElementById('rec-btn-' + section);
            const preview = document.getElementById('preview-' + section);

            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => {
                        if (event.data.size > 0) audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const audioUrl = URL.createObjectURL(audioBlob);
                        recordedUrls[section] = audioUrl;
                        preview.innerHTML = `<p style="font-size:12px; color:#4caf50; margin:5px 0;">✅ የተቀዳው ድምፅ (ያዳምጡት)፦</p><audio controls src="${audioUrl}"></audio>`;
                        stream.getTracks().forEach(track => track.stop());
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    btn.innerText = "⏹️ መቅዳት አቁም (Stop)";
                    btn.classList.add("recording");
                } catch (err) {
                    alert("የስልክዎ ማይክሮፎን አልተፈቀደም! እባክዎ የማይክሮፎን ፈቃድ (Allow Microphone) ይስጡ።");
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                btn.innerText = "🎙️ እንደገና ድምፅ ቅዳ";
                btn.classList.remove("recording");
            }
        }

        // 1. ምስጢር መልቀቂያ (ከድምፅ ጋር)
        function postMystery() {
            const text = document.getElementById('mystery-text').value;
            const audioUrl = recordedUrls.mystery;
            if (!text && !audioUrl) return alert("እባክዎ መጀመሪያ ድምፅ ይቅዱ ወይም ጽሁፍ ይጻፉ!");

            let audioHtml = audioUrl ? `<audio controls src="${audioUrl}"></audio>` : '';
            let textHtml = text ? `<p>${text}</p>` : '';

            const list = document.getElementById('mystery-list');
            list.innerHTML = `<div class="card"><strong>🎙️ አዲስ የድምፅ ምስጢር፡</strong>${audioHtml}${textHtml}</div>` + list.innerHTML;
            
            document.getElementById('mystery-text').value = '';
            document.getElementById('preview-mystery').innerHTML = '';
            recordedUrls.mystery = null;
        }

        // 2. ክህሎት መለዋወጫ
        function postBarter() {
            const offer = document.getElementById('offer-skill').value;
            const want = document.getElementById('want-skill').value;
            if (!offer || !want) return alert("እባክዎ ሁለቱንም ሳጥኖች ይሙሉ!");
            const list = document.getElementById('barter-list');
            list.innerHTML = `<div class="card"><strong>የክህሎት ጥያቄ፡</strong><br>✅ እሰጣለሁ: ${offer}<br>🎯 እፈልጋለሁ: ${want}</div>` + list.innerHTML;
            document.getElementById('offer-skill').value = '';
            document.getElementById('want-skill').value = '';
        }

        // 3. ጊዜ ካፕሱል መቆለፊያ (ከድምፅ ጋር)
        function saveCapsule() {
            const msg = document.getElementById('capsule-msg').value;
            const date = document.getElementById('capsule-date').value;
            const audioUrl = recordedUrls.capsule;
            if ((!msg && !audioUrl) || !date) return alert("እባክዎ ድምፅ/መልዕክት እና ቀን ይምረጡ!");

            const list = document.getElementById('capsule-list');
            list.innerHTML = `<div class="card">🔒 <strong>የተቆለፈ የድምፅ/ጽሁፍ ካፕሱል</strong><br>የሚከፈትበት ቀን: ${date}<br><small>መልዕክቱ እስከ ቀኑ ድረስ ተደብቋል</small></div>` + list.innerHTML;
            
            document.getElementById('capsule-msg').value = '';
            document.getElementById('preview-capsule').innerHTML = '';
            recordedUrls.capsule = null;
        }
    </script>
</body>
</html>
